runtime:
  active_provider: ''
providers: {}
fallback_providers: []
credential_pool_strategies: {}
companion_workers:
  default_role: general
  max_concurrent: 4
  roles:
    general:
      label: 通用员工
      description: 处理不属于专门角色的综合工作
      enabled: true
      provider: ''
      model: ''
      toolsets:
      - web
      - file
      - mail
      - skills
      - todo
      concurrency_limit: 1
    research:
      label: 调研员工
      description: 负责检索、核实、比较和整理外部信息
      enabled: true
      provider: ''
      model: ''
      toolsets:
      - learn
      concurrency_limit: 1
    coding:
      label: 工程员工
      description: 负责读取项目、编写或修改代码并运行验证
      enabled: true
      provider: ''
      model: ''
      toolsets:
      - file
      - terminal
      - code_execution
      - skills
      - todo
      concurrency_limit: 1
    media:
      label: 媒体员工
      description: 负责生成、查找、组织、交付和播放媒体产物
      enabled: true
      provider: ''
      model: ''
      toolsets:
      - media
      - web
      concurrency_limit: 1
image_generation:
  provider: agnes-ai
  api_key_env: AGNES_API_KEY
  endpoint: https://api.agnes-ai.cn/v1/images/generations
  edit_endpoint: https://api.agnes-ai.cn/v1/images/edits
  model: agnes-image-2.1-flash
  request_timeout_seconds: 120
video_generation:
  provider: agnes-ai
  api_key_env: AGNES_API_KEY
  endpoint: https://api.agnes-ai.cn/v1/videos
  result_endpoint: https://api.agnes-ai.cn/agnesapi
  model: agnes-video-v2.0
  request_timeout_seconds: 120
  poll_interval_seconds: 3
  timeout_seconds: 600
