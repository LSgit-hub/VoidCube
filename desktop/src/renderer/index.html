<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; frame-src http://127.0.0.1:* http://localhost:*; connect-src 'self' ws://localhost:*;"
    />
    <title>VoidCube</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="app-bar">
        <div class="brand" aria-label="VoidCube Desktop">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <div class="brand-copy">
            <strong>VoidCube</strong>
            <span>Desktop</span>
          </div>
        </div>
        <div class="app-actions">
          <div class="layout-switcher" role="group" aria-label="桌面布局">
            <button class="icon-button" type="button" data-layout-mode="split" title="上下分屏" aria-label="上下分屏" aria-pressed="true">
              <i data-lucide="rows-3" aria-hidden="true"></i>
            </button>
            <button class="icon-button" type="button" data-layout-mode="monitor" title="监控最大化" aria-label="监控最大化" aria-pressed="false">
              <i data-lucide="panel-top" aria-hidden="true"></i>
            </button>
            <button class="icon-button" type="button" data-layout-mode="terminal" title="终端最大化" aria-label="终端最大化" aria-pressed="false">
              <i data-lucide="square-terminal" aria-hidden="true"></i>
            </button>
          </div>
          <span class="action-divider" aria-hidden="true"></span>
          <details id="plugin-menu" class="plugin-menu">
            <summary class="icon-button" title="插件管理器" aria-label="插件管理器">
              <i data-lucide="puzzle" aria-hidden="true"></i>
            </summary>
            <div class="plugin-popover">
              <div class="plugin-popover-heading">
                <strong>插件管理器</strong>
                <span id="plugins-summary">检查中</span>
              </div>
              <div id="plugin-list" class="plugin-list" aria-live="polite">
                <p id="plugins-empty" class="plugins-empty">正在读取插件</p>
              </div>
              <p id="plugins-error" class="plugins-error" hidden></p>
            </div>
          </details>
          <button id="reload-monitor" class="icon-button" type="button" title="重新加载监控页面" aria-label="重新加载监控页面">
            <i data-lucide="refresh-cw" aria-hidden="true"></i>
          </button>
          <button id="restart-terminal" class="icon-button" type="button" title="重启 CLI" aria-label="重启 CLI">
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
          </button>
          <span class="action-divider" aria-hidden="true"></span>
          <div class="window-controls" aria-label="窗口控制">
            <button id="minimize-window" class="icon-button" type="button" title="最小化" aria-label="最小化">
              <i data-lucide="minus" aria-hidden="true"></i>
            </button>
            <button id="close-window" class="icon-button close-button" type="button" title="关闭窗口" aria-label="关闭窗口">
              <i data-lucide="x" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </header>

      <main id="workspace" class="workspace">
        <section class="monitor-pane" aria-label="Supervisor 监控页面">
          <iframe
            id="monitor-frame"
            title="VoidCube Supervisor"
            sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads allow-popups"
            allow="fullscreen"
          ></iframe>
          <section id="plugin-view" class="plugin-view" aria-label="插件界面" hidden>
            <div class="plugin-view-bar">
              <div class="plugin-view-title">
                <i data-lucide="puzzle" aria-hidden="true"></i>
                <strong id="plugin-view-title">插件</strong>
              </div>
              <button id="close-plugin-view" class="icon-button" type="button" title="关闭插件界面" aria-label="关闭插件界面">
                <i data-lucide="x" aria-hidden="true"></i>
              </button>
            </div>
            <div class="plugin-frame-host">
              <iframe
                id="plugin-frame"
                title="VoidCube 插件界面"
                sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads allow-popups"
                allow="fullscreen"
              ></iframe>
              <div id="plugin-overlay" class="plugin-overlay">
                <span class="loading-ring" aria-hidden="true"></span>
                <strong>正在打开插件</strong>
              </div>
            </div>
          </section>
          <div id="monitor-overlay" class="monitor-overlay">
            <span class="loading-ring" aria-hidden="true"></span>
            <strong id="monitor-overlay-title">正在启动 Supervisor</strong>
            <span id="monitor-overlay-detail">本地监控服务就绪后将在这里显示</span>
            <button id="retry-monitor" class="command-button" type="button" hidden>重试连接</button>
          </div>
        </section>

        <div
          id="splitter"
          class="splitter"
          role="separator"
          aria-label="调整监控与终端高度"
          aria-orientation="horizontal"
          aria-valuemin="25"
          aria-valuemax="75"
          aria-valuenow="54"
          tabindex="0"
        ><span aria-hidden="true"></span></div>

        <section class="terminal-pane" aria-label="VoidCube Agent CLI">
          <div class="pane-bar">
            <div class="pane-title">
              <span class="terminal-glyph" aria-hidden="true">›_</span>
              <strong>Agent CLI</strong>
            </div>
            <div id="execution-context" class="execution-context" aria-live="polite">
              <details id="execution-selector" class="execution-selector">
                <summary id="execution-selector-summary" class="context-item context-selector-button" title="选择执行环境">
                  <i data-lucide="shield-check" aria-hidden="true"></i>
                  <span>执行环境</span>
                  <strong id="execution-mode">检测中</strong>
                  <i data-lucide="chevron-down" class="selector-chevron" aria-hidden="true"></i>
                </summary>
                <div class="execution-popover" role="menu" aria-label="执行环境选择">
                  <button type="button" data-terminal-backend="local" role="menuitemradio" aria-checked="false">
                    <i data-lucide="monitor" aria-hidden="true"></i>
                    <span>
                      <strong id="local-backend-label">Windows 本地环境</strong>
                      <small>宿主机受限终端</small>
                    </span>
                    <i data-lucide="check" class="backend-check" aria-hidden="true"></i>
                  </button>
                  <button type="button" data-terminal-backend="podman" role="menuitemradio" aria-checked="false">
                    <i data-lucide="box" aria-hidden="true"></i>
                    <span>
                      <strong>Linux Podman 沙箱</strong>
                      <small>隔离容器终端</small>
                    </span>
                    <i data-lucide="check" class="backend-check" aria-hidden="true"></i>
                  </button>
                  <p id="execution-selector-status" class="execution-selector-status" hidden></p>
                </div>
              </details>
              <span class="context-divider" aria-hidden="true"></span>
              <span class="context-item body-verification-context" title="替身改进任务的受治理验证环境">
                <i data-lucide="box" aria-hidden="true"></i>
                <span>替身验证</span>
                <strong id="body-improvement-backend">检测中</strong>
              </span>
              <span class="context-divider" aria-hidden="true"></span>
              <button
                id="open-workspace"
                class="context-item context-button"
                type="button"
                title="在文件管理器中打开工作区"
              >
                <i data-lucide="folder-git-2" aria-hidden="true"></i>
                <span>工作区</span>
                <strong id="execution-workspace">等待 CLI</strong>
              </button>
            </div>
            <details id="service-process-menu" class="service-process-menu">
              <summary class="pane-meta-button" title="后台服务进程" aria-label="后台服务进程">
                <span id="terminal-meta" class="pane-meta">等待进程</span>
                <i data-lucide="chevron-down" class="selector-chevron" aria-hidden="true"></i>
              </summary>
              <div class="service-process-popover">
                <div class="service-process-heading">
                  <strong>后台服务进程</strong>
                  <span id="services-summary">检查中</span>
                </div>
                <div id="service-list" class="service-list" aria-live="polite"></div>
                <p id="services-error" class="services-error" hidden></p>
                <div class="service-commands">
                  <button id="start-services" type="button">
                    <i data-lucide="play" aria-hidden="true"></i>
                    <span>启动全部</span>
                  </button>
                  <button id="restart-services" type="button">
                    <i data-lucide="refresh-cw" aria-hidden="true"></i>
                    <span>重启全部</span>
                  </button>
                  <button id="stop-services" type="button">
                    <i data-lucide="square" aria-hidden="true"></i>
                    <span>停止全部</span>
                  </button>
                </div>
              </div>
            </details>
          </div>
          <div id="terminal" class="terminal-host"></div>
          <div id="terminal-error" class="terminal-error" hidden>
            <strong>CLI 无法启动</strong>
            <span id="terminal-error-message"></span>
            <button id="retry-terminal" class="command-button" type="button">重新启动</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
