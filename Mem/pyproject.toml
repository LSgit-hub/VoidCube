[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memai"
version = "0.1.0"
description = "A time-first memory management toolkit for long-running language model interactions"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenCode" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
memai = "memai.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memai = ["prompts/*/*.txt"]
