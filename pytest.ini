[pytest]
testpaths = tests
pythonpath =
    .
    Mem/src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: marks tests as slow running
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    stability_core: marks core stability and anti-drift tests
    stability_longcycle: marks long-cycle stability replay tests
    agent: marks tests as agent core tests
    cli: marks tests as CLI tests
    tools: marks tests as tools tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
