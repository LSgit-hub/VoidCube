[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voidcube-agent"
version = "1.0.0"
description = "轻量安装·快速配置·友好交互 — 服务器运维与部署智能体"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "agent", "ops", "devops", "deploy", "cli", "assistant", "local", "shell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # 核心
    "openai>=1.0.0,<2",
    "httpx>=0.25.0,<1",
    "rich>=13.0.0,<14",
    "prompt_toolkit>=3.0.0,<4",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0.0,<2",
    "tenacity>=8.0.0,<9",
    "pydantic>=2.0.0,<3",
    "requests>=2.31.0,<3",
    "fire>=0.5.0,<1",
]

[project.optional-dependencies]
# 本地 LLM 支持
local = [
    "beautifulsoup4>=4.12.0,<5",
    "lxml>=5.0.0,<6",
]
# 图像生成 (可选)
image = [
    "pillow>=10.0.0,<11",
]
# 语音 (可选)
voice = [
    "edge-tts>=6.0.0,<7",
]
# Web 工具
web = [
    "firecrawl-py>=0.1.0",
    "parallel-web>=0.4.2",
]
# 完整安装（兼容两种命名习惯）
full = [
    "voidcube-agent[local,image,voice,web]",
]
all = [
    "voidcube-agent[full]",
]

[project.scripts]
voidcube = "cli:main"
vc = "cli:main"

[project.urls]
Homepage = "https://gitee.com/LSgit-hub/voidcub-CLI"
Documentation = "https://gitee.com/LSgit-hub/voidcub-CLI#readme"
Repository = "https://gitee.com/LSgit-hub/voidcub-CLI"

[tool.setuptools]
py-modules = ["cli", "run_agent", "model_tools", "toolsets", "VoidCube_constants", "utils"]

[tool.setuptools.packages.find]
where = [".", "Mem/src"]
include = ["agent", "tools", "VoidCube_cli", "memai"]
