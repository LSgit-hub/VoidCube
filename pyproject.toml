[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voidcube-agent"
dynamic = ["version"]
description = "自进化双api智能体"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
keywords = ["ai", "agent", "ops", "devops", "deploy", "cli", "assistant", "local", "shell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # 核心
    "openai>=1.0.0,<2",
    "httpx>=0.25.0,<1",
    "rich>=13.0.0,<14",
    "prompt_toolkit>=3.0.0,<4",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0.0,<2",
    "pydantic>=2.0.0,<3",
    "requests>=2.31.0,<3",
    "fire>=0.5.0,<1",
    # The unified launcher starts these local services by default.
    "aiohttp>=3.14.3,<4",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.32.0,<1",
    "psutil>=6.1.0,<8",
    "sqlite-vec>=0.1,<1",
]

[project.optional-dependencies]
# 本地 LLM 支持
local = [
    "beautifulsoup4>=4.12.0,<5",
    "lxml>=6.0.0,<7",
]
# 图像生成 (可选)
image = [
    "pillow>=12.3.0,<13",
]
# 语音 (可选)
voice = [
    "edge-tts>=7.2.8,<8",
    "faster-whisper>=1.2.0,<2",
    "numpy>=2.0.0,<3",
    "sounddevice>=0.5.0,<1",
    "soundfile>=0.13.0,<1",
    "sherpa-onnx>=1.13.4,<2",
    "truststore>=0.10.0,<1",
]
# Web 工具
web = [
    "firecrawl-py>=0.1.0",
    "parallel-web>=0.4.2",
]
# Windows desktop automation
desktop = [
    "uiautomation>=2.0.29,<3; platform_system == 'Windows'",
]
dev = [
    "build>=1.2.0,<2",
    "pip-audit>=2.9.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0.0,<2",
    "pytest-cov>=6.0.0,<8",
    "ruff>=0.12.0,<1",
]
# 完整安装（兼容两种命名习惯）
full = [
    "voidcube-agent[local,image,voice,web,desktop]",
]
all = [
    "voidcube-agent[full]",
]

[project.scripts]
voidcube = "voidcube:main"
vc = "voidcube:main"

[project.urls]
Homepage = "https://gitee.com/LSgit-hub/voidcub-CLI"
Documentation = "https://gitee.com/LSgit-hub/voidcub-CLI#readme"
Repository = "https://gitee.com/LSgit-hub/voidcub-CLI"

[tool.setuptools]
py-modules = ["voidcube", "cli", "run_agent"]

[tool.setuptools.dynamic]
version = {attr = "VoidCube_cli.__version__"}

[tool.setuptools.packages.find]
where = [".", "Mem/src"]
include = ["agent*", "tools*", "VoidCube_app*", "VoidCube_cli*", "VoidCube_core*", "systems*", "plugins*", "memai*"]

[tool.setuptools.package-data]
memai = ["prompts/*/*.txt", "identity/*.json", "identity/*.md"]
VoidCube_cli = ["locales/*.json"]
systems = ["supervisor/web/*.html"]
tools = ["presets/*.yaml"]

[tool.ruff]
target-version = "py314"
exclude = [".test-tmp", ".venv", "build", "dist"]

[tool.ruff.lint]
# Start with deterministic parser/control-flow failures. F821 is reported
# separately in CI until the existing undefined-name baseline is retired.
select = ["E9", "F63", "F7"]

[tool.coverage.run]
branch = true
source = [
    "agent",
    "tools",
    "systems",
    "VoidCube_app",
    "VoidCube_cli",
    "VoidCube_core",
    "plugins",
    "memai",
    "run_agent",
    "voidcube",
    "cli",
]
omit = ["tests/*", "Mem/tests/*"]

[tool.coverage.report]
fail_under = 50.0
precision = 1
show_missing = true
skip_covered = true
