version: '1.0'
name: voidcube-memory-nightly
displayName: VoidCube memory nightly soak
stages:
  - stage:
    name: memory_nightly_soak
    displayName: Memory outbox 180 second soak
    steps:
      - step: build@python
        name: memory_outbox_soak
        displayName: Install and run memory soak
        pythonVersion: '3.14'
        commands:
          - python3 -m pip install --upgrade pip
          - python3 -m pip install -e ".[all,dev]"
          - python3 scripts/smoke_memory_outbox.py --mode soak --duration-seconds 180
          - python3 -m pytest tests/test_memory_outbox_operational.py tests/test_memory_health_signals.py -q
triggers:
  schedule:
    - cron: '0 18 * * *'
      branches:
        include:
          - master
