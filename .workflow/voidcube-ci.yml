version: '1.0'
name: voidcube-ci
displayName: VoidCube CI
stages:
  - stage:
    name: quality
    displayName: Python 3.14 static and Mem test gate
    steps:
      - step: build@python
        name: full_test_gate
        displayName: Install and test
        pythonVersion: '3.14'
        commands:
          - python3 -m pip install --upgrade pip
          - python3 -m pip install -e ".[all,dev]"
          - python3 -m ruff check .
          - python3 -m ruff check . --select F821
          - python3 -m pip_audit --vulnerability-service osv --progress-spinner off
          - python3 -m compileall -q agent systems tools VoidCube_core VoidCube_app VoidCube_cli Mem
          - python3 -m pytest Mem/tests -q --cov=Mem --cov-report=term
triggers:
  push:
    branches:
      include:
        - master
  pr:
    branches:
      include:
        - master
