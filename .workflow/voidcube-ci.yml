version: '1.0'
name: voidcube-ci
displayName: VoidCube CI
stages:
  - stage:
    name: test
    displayName: Python 3.14 full test gate
    steps:
      - step: build@python
        name: full_test_gate
        displayName: Install and test
        pythonVersion: '3.14'
        commands:
          - python3 -m pip install --upgrade pip
          - python3 -m pip install -e ".[all,dev]"
          - python3 -m ruff check .
          - python3 -m ruff check . --select F821
          - python3 -m pip_audit --vulnerability-service osv --progress-spinner off
          - python3 scripts/run_ci_tests.py -- tests Mem/tests -q --cov --cov-report=term --cov-report=xml:coverage.xml
triggers:
  push:
    branches:
      include:
        - master
  pr:
    branches:
      include:
        - master
